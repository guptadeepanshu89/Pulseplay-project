<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none">
  <defs>
    <linearGradient id="cCardGrad" x1="40" y1="40" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4effc"/>
    </linearGradient>
    <linearGradient id="cBuildGrad" x1="140" y1="90" x2="230" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5b21b6" flood-opacity="0.14"/>
    </filter>
  </defs>

  <path d="M168 118 C120 90, 90 70, 62 58" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
  <path d="M220 100 C250 70, 280 55, 310 48" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
  <path d="M235 150 C270 150, 300 165, 322 190" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>

  <!-- main building card -->
  <g filter="url(#cSoft)">
    <rect x="110" y="70" width="150" height="150" rx="28" fill="url(#cCardGrad)" stroke="#ebe4f5"/>
    <rect x="148" y="102" width="74" height="88" rx="10" fill="url(#cBuildGrad)"/>
    <rect x="158" y="114" width="14" height="14" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="178" y="114" width="14" height="14" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="198" y="114" width="14" height="14" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="158" y="136" width="14" height="14" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="178" y="136" width="14" height="14" rx="2" fill="#fff" opacity="0.9"/>
    <rect x="198" y="136" width="14" height="14" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="172" y="160" width="26" height="30" rx="4" fill="#ede9fe"/>
  </g>

  <circle cx="248" cy="88" r="18" fill="#6366f1" filter="url(#cSoft)"/>
  <path d="M248 80v16M240 88h16" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- floating admin/user -->
  <g filter="url(#cSoft)">
    <rect x="28" y="28" width="52" height="52" rx="16" fill="#fff" stroke="#ebe4f5"/>
    <circle cx="54" cy="46" r="8" fill="#7c3aed"/>
    <path d="M40 66c3-10 9-14 14-14s11 4 14 14" fill="#7c3aed"/>
  </g>

  <!-- floating shield -->
  <g filter="url(#cSoft)">
    <rect x="286" y="18" width="52" height="52" rx="16" fill="#fff" stroke="#ebe4f5"/>
    <path d="M312 30l12 5v11c0 9-5 16-12 20-7-4-12-11-12-20V35l12-5z" fill="#7c3aed"/>
    <path d="M307 47l4 4 8-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating chart -->
  <g filter="url(#cSoft)">
    <rect x="298" y="168" width="52" height="52" rx="16" fill="#fff" stroke="#ebe4f5"/>
    <rect x="310" y="198" width="7" height="10" rx="2" fill="#c4b5fd"/>
    <rect x="321" y="190" width="7" height="18" rx="2" fill="#8b5cf6"/>
    <rect x="332" y="182" width="7" height="26" rx="2" fill="#5b21b6"/>
  </g>

  <!-- plant -->
  <g filter="url(#cSoft)">
    <rect x="42" y="214" width="46" height="36" rx="12" fill="#fff" stroke="#ebe4f5"/>
    <path d="M65 214c-2-16 8-26 8-26s8 12 4 26" fill="#a78bfa"/>
    <path d="M58 214c-8-14-4-28-4-28s14 8 12 28" fill="#7c3aed"/>
    <path d="M72 214c8-12 6-26 6-26s12 12 4 26" fill="#8b5cf6"/>
  </g>
</svg>
